{{ define "main" }}
<div class="homepage-content">
    <section id="projects" class="projects-section">
        {{ range (where .Site.RegularPages "Section" "projects") }}
        <div class="project-item">
            {{ if .Params.external_url }}
            <h3 class="project-title"><a href="{{ .Params.external_url }}" target="_blank" rel="noopener noreferrer">{{ .Title }}</a></h3>
            {{ else }}
            <h3 class="project-title">{{ .Title }}</h3>
            {{ end }}
            <p class="project-description">{{ .Content }}</p>
        </div>
        {{ end }}
    </section>
</div>

<style>
.homepage-content {
    max-width: 800px;
    margin: 0 auto;
    padding: 2rem;
}

.project-item {
    margin-bottom: 3rem;
    padding-bottom: 2rem;
    border-bottom: 1px solid var(--color-border);
}

.project-item:last-child {
    border-bottom: none;
}

.project-title {
    font-size: 2.25rem;
    font-weight: 700;
    margin-bottom: 1rem;
    color: var(--color-text);
    line-height: 1.2;
}

.project-title a {
    color: var(--color-text);
    text-decoration: none;
    transition: color 0.2s ease;
}

.project-title a:hover {
    color: var(--color-link-hover);
    text-decoration: underline;
}

.project-description {
    color: var(--color-text-secondary);
    line-height: 1.6;
    font-size: 0.9rem;
}

@media (prefers-color-scheme: dark) {
    :root {
        --color-text: #ffffff;
        --color-text-secondary: #b3b3b3;
        --color-border: #333;
        --color-link-hover: #81c784;
    }
}

@media (prefers-color-scheme: light) {
    :root {
        --color-text: #1a1a1a;
        --color-text-secondary: #4a4a4a;
        --color-border: #e0e0e0;
        --color-link-hover: #388e3c;
    }
}

@media (max-width: 768px) {
    .project-title {
        font-size: 1.75rem;
    }
    
    .project-description {
        font-size: 0.85rem;
    }
}
</style>
{{ end }}
